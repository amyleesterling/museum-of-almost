<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A tiny interactive museum of impossible objects. Take the scenic route, return the rain, or borrow a spare minute.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">
  <title>The Museum of Almost</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fff;
      --foreground: #1a1c1f;
      --muted-foreground: #565a60;
      --orange: #e25507;
      --green: #00a240;
      --surface: #fff;
      --edge: #d7d9dc;
      --selected: #185abc;
      --selected-text: #fff;
      --hover: #f1f3f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #181818;
        --foreground: #fff;
        --muted-foreground: #b8bdc5;
        --orange: #fb6a22;
        --green: #40c977;
        --surface: #292929;
        --edge: #5d6269;
        --selected: #a9caff;
        --selected-text: #152034;
        --hover: #383838;
      }
    }
    * { box-sizing:border-box; }
    body { margin:0; padding:clamp(16px,4vw,40px); background:var(--background); color:var(--foreground); font:16px/1.5 system-ui,sans-serif; }
    button { font:inherit; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 12px; max-width:100%; border:1px solid var(--edge); border-radius:10px; background:var(--surface); color:var(--foreground); cursor:pointer; text-align:center; }
    .btn:hover { background:var(--hover); }
    .btn[aria-pressed="true"] { background:var(--selected); color:var(--selected-text); border-color:var(--selected); }
    .btn-primary { background:var(--foreground); color:var(--background); border-color:var(--foreground); }
    .btn-primary:hover { background:var(--foreground); opacity:.88; }
    .btn:focus-visible { outline:3px solid var(--selected); outline-offset:4px; }
    noscript { display:block; max-width:736px; margin:24px auto; }
  </style>
</head>
<body>
<main>
<div id="museum-almost">
  <style>
    #museum-almost { --font-size-base:16px; --font-size-normal:16px; --font-size-small:14px; --font-size-tooltip:14px; color:var(--foreground); font-family:system-ui,sans-serif; font-size:16px; line-height:1.5; padding:12px 0 20px; max-width:736px; margin:0 auto; }
    #museum-almost .museum-heading { font-family:Georgia,serif; font-weight:400; font-size:clamp(32px,6vw,46px); line-height:1.2; margin:0 0 10px; }
    #museum-almost .museum-intro { margin:0 0 24px; font-size:16px; }
    #museum-almost .museum-nav { display:flex; flex-wrap:wrap; gap:8px; }
    #museum-almost .museum-stage { width:100%; height:340px; display:block; }
    #museum-almost .museum-caption { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap; }
    #museum-almost .museum-caption h2 { font-family:Georgia,serif; font-size:24px; line-height:1.35; font-weight:400; margin:0 0 8px; }
    #museum-almost .museum-note { font-size:16px; margin:0; max-width:46ch; }
    #museum-almost .museum-number { font-size:14px; margin:22px 0 0; }
    @media(max-width:440px) { #museum-almost .museum-stage { height:280px; } }
  </style>
  <h1 class="museum-heading">The Museum of Almost</h1>
  <p class="museum-intro">Four useful things that do not exist.</p>
  <div class="museum-nav" role="group" aria-label="Choose an exhibit">
    <button type="button" class="btn" aria-pressed="true" data-exhibit="0">Compass</button>
    <button type="button" class="btn" aria-pressed="false" data-exhibit="1">Umbrella</button>
    <button type="button" class="btn" aria-pressed="false" data-exhibit="2">Spare minute</button>
    <button type="button" class="btn" aria-pressed="false" data-exhibit="3">Dragon</button>
  </div>
  <canvas class="museum-stage" role="img" aria-label="A brass compass on a small pedestal, pointing somewhere unexpected."></canvas>
  <div class="museum-caption">
    <div aria-live="polite" aria-atomic="true">
      <h2 data-name>A compass for getting lost</h2>
      <p class="museum-note" data-note>It points toward something you haven't tried.</p>
    </div>
    <button type="button" class="btn btn-primary" data-action>Take the scenic route</button>
  </div>
  <p class="museum-number" data-number>Object 01 / 04 · Brass, possibility</p>
  <script>
  (() => {
    // Time and sand amounts are independent of drawing and animation frame rate.
class SandClock {
  constructor(duration = 60000, turnDuration = 1200) {
    this.duration = duration;
    this.turnDuration = turnDuration;
    this.upper = 0;
    this.startedAt = 0;
    this.turn = null;
    this.hasRun = false;
  }

  read(now) {
    if (this.turn && now >= this.turn.endsAt) {
      this.upper = 1 - this.turn.upper;
      this.startedAt = this.turn.endsAt;
      this.turn = null;
    }
    if (this.turn) {
      const t = (now - this.turn.startedAt) / this.turnDuration;
      return {
        upper: this.turn.upper,
        lower: 1 - this.turn.upper,
        angle: Math.PI * t * t * (3 - 2 * t),
        turning: true,
        flowing: false,
        hasRun: this.hasRun
      };
    }
    const upper = this.hasRun
      ? Math.max(0, this.upper - (now - this.startedAt) / this.duration)
      : 0;
    return { upper, lower: 1 - upper, angle: 0, turning: false,
      flowing: upper > 0, hasRun: this.hasRun };
  }

  flip(now, reducedMotion = false) {
    const state = this.read(now);
    if (state.turning) return false;
    this.hasRun = true;
    this.turn = { upper: state.upper, startedAt: now,
      endsAt: now + (reducedMotion ? 0 : this.turnDuration) };
    this.read(now);
    return true;
  }
}

    const root = document.getElementById('museum-almost');
    const canvas = root.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const title = root.querySelector('[data-name]');
    const note = root.querySelector('[data-note]');
    const number = root.querySelector('[data-number]');
    const action = root.querySelector('[data-action]');
    const buttons = [...root.querySelectorAll('[data-exhibit]')];
    const exhibits = [
      {name:'A compass for getting lost', note:"It points toward something you haven't tried.", action:'Take the scenic route', material:'Brass, possibility', alt:'A brass compass on a small pedestal, pointing somewhere unexpected.'},
      {name:'An umbrella for clouds', note:'Sometimes the sky needs its rain back.', action:'Return the rain', material:'Copper, reverse weather', alt:'A copper umbrella beneath a small cloud; drops can travel upward into the cloud.'},
      {name:'One spare minute', note:'No appointments. No useful purpose required.', action:'Borrow a minute', material:'Glass, unallocated time', alt:'An hourglass held in a brass frame. Turn it over to watch sand fall for one minute.'},
      {name:'A dragon for unfinished things', note:'It keeps almosts warm until they are ready.', action:'Entrust an almost', material:'Leaves, patience', alt:'A gentle green leaf-winged dragon curls protectively around a collection of small unfinished shapes.'}
    ];
    let current=0, width=0, height=0, raf=0, start=0, progress=1, turns=0, rainUp=false, dragonAttempt=0;
    let fromAngle=-0.6, toAngle=-0.6, sandTimer=0, sandPhase='';
    const sandClock=new SandClock();
    let palette;
    const tau=Math.PI*2;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    function colors() {
      const probe=document.createElement('span'); root.append(probe);
      const read=name=>{probe.style.color='var('+name+')'; return getComputedStyle(probe).color;};
      palette={ink:read('--foreground'), paper:read('--background'), gold:read('--orange'), leaf:read('--green'), muted:read('--muted-foreground')};
      probe.remove();
    }
    function path(points, color, line=1.5, fill=false, alpha=1) {
      ctx.globalAlpha=alpha; ctx.beginPath();
      points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));
      if(fill){ctx.closePath();ctx.fillStyle=color;ctx.fill();}
      else{ctx.strokeStyle=color;ctx.lineWidth=line;ctx.stroke();}
      ctx.globalAlpha=1;
    }
    function ellipse(x,y,rx,ry,color,fill=false,alpha=1,line=1.5) {
      ctx.globalAlpha=alpha;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,tau);
      if(fill){ctx.fillStyle=color;ctx.fill();}else{ctx.strokeStyle=color;ctx.lineWidth=line;ctx.stroke();}
      ctx.globalAlpha=1;
    }
    function pedestal() {
      ellipse(0,133,167,14,palette.ink,true,.045);
      path([[-112,96],[-112,119],[0,143],[112,119],[112,96]],palette.ink,1.4,false,.25);
      path([[-112,96],[0,120],[112,96],[0,73],[-112,96]],palette.ink,1.4,false,.35);
      path([[0,120],[0,143]],palette.ink,1.4,false,.2);
    }
    function compass(t) {
      const a=fromAngle+(toAngle-fromAngle)*t;
      ellipse(0,91,84,13,palette.ink,true,.08);
      path([[-116,0],[-116,17],[116,17],[116,0]],palette.gold,1.5,false,.5);
      ellipse(0,18,116,68,palette.gold,true,.1);
      ellipse(0,18,116,68,palette.gold,false,.8,2);
      ellipse(0,0,116,68,palette.paper,true);
      ellipse(0,0,116,68,palette.gold,false,1,3);
      ellipse(0,0,105,60,palette.gold,false,.7);
      ellipse(0,0,93,53,palette.ink,false,.2);
      for(let i=0;i<60;i++){
        const v=i*tau/60, r=i%5===0?81:88;
        path([[Math.cos(v)*r,Math.sin(v)*r*.57],[Math.cos(v)*95,Math.sin(v)*54]],palette.ink,i%5===0?1.7:1,false,i%5===0?.55:.22);
      }
      for(let i=0;i<8;i++){
        const v=i*tau/8, p=(r,d=0)=>[Math.cos(v+d)*r,Math.sin(v+d)*r*.57];
        path([p(6),p(56),p(18,.22)],palette.gold,1,true,.2);
      }
      const point=(r,d=0)=>[Math.cos(a+d)*r,Math.sin(a+d)*r*.57];
      path([point(82),point(13,Math.PI/2),point(-63),point(13,-Math.PI/2)],palette.paper,1,true);
      path([point(82),point(13,Math.PI/2),point(0)],palette.gold,1,true,.95);
      path([point(82),point(13,-Math.PI/2),point(0)],palette.gold,1,true,.45);
      path([point(-63),point(13,Math.PI/2),point(0)],palette.ink,1,true,.4);
      path([point(-63),point(13,-Math.PI/2),point(0)],palette.ink,1,true,.15);
      ellipse(0,0,7,4,palette.gold,true);
      ellipse(0,-80,15,9,palette.gold,false,.9,2);
      path([[0,-68],[0,-71]],palette.gold,2);
      const sparks=t<1?Math.sin(t*Math.PI):0;
      for(let i=0;i<9;i++){
        const v=i*tau/9+t*1.2;
        ellipse(Math.cos(v)*(128+25*t),Math.sin(v)*83,2,2,palette.gold,true,sparks*.7);
      }
    }
    function umbrella(t) {
      const moving=t<1;
      for(let i=0;i<21;i++){
        const x=-132+(i*47%265), initial=(i*61%145);
        let y=-81+initial;
        if(moving)y=rainUp?63-((initial+t*200)%155):-91+((initial+t*200)%155);
        const delta=rainUp?-9:9;
        path([[x,y],[x-2,y+delta]],palette.leaf,1.5,false,.38);
      }
      ctx.strokeStyle=palette.gold;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-43);ctx.lineTo(0,77);ctx.bezierCurveTo(0,111,39,107,34,81);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-113,0);ctx.bezierCurveTo(-85,-111,79,-111,113,0);
      ctx.bezierCurveTo(89,-13,66,-12,48,3);ctx.bezierCurveTo(24,-12,-23,-12,-48,3);ctx.bezierCurveTo(-67,-12,-90,-13,-113,0);
      ctx.fillStyle=palette.paper;ctx.fill();ctx.fillStyle=palette.gold;ctx.globalAlpha=.16;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=palette.gold;ctx.lineWidth=2;ctx.stroke();
      [-48,48].forEach(x=>{ctx.beginPath();ctx.moveTo(0,-80);ctx.bezierCurveTo(x*.72,-65,x*.94,-35,x,3);ctx.strokeStyle=palette.gold;ctx.lineWidth=1.2;ctx.stroke();});
      path([[0,-79],[0,-94]],palette.gold,2);
      ctx.beginPath();ctx.moveTo(-57,-121);ctx.bezierCurveTo(-86,-148,-39,-164,-23,-147);ctx.bezierCurveTo(-17,-182,45,-175,42,-146);ctx.bezierCurveTo(79,-153,88,-121,57,-116);ctx.bezierCurveTo(15,-111,-22,-110,-57,-121);
      ctx.fillStyle=palette.paper;ctx.fill();ctx.globalAlpha=.1;ctx.fillStyle=palette.leaf;ctx.fill();ctx.globalAlpha=.7;ctx.strokeStyle=palette.leaf;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
      if(rainUp&&t===1){
        [-31,-12,8,29].forEach((x,i)=>{ellipse(x,-137-i%2*7,2,2,palette.leaf,true,.7);});
      }
    }
    function glassPath() {
      ctx.beginPath();ctx.moveTo(-45,-76);ctx.bezierCurveTo(-47,-38,-17,-10,-7,0);ctx.bezierCurveTo(-17,14,-47,37,-45,76);ctx.lineTo(45,76);ctx.bezierCurveTo(47,37,17,14,7,0);ctx.bezierCurveTo(17,-10,47,-38,45,-76);ctx.closePath();
    }
    // Integrate the upper bulb's width once, so equal sand amounts occupy
    // equal areas even though the glass narrows near the neck.
    const upperProfile=[];
    let upperArea=0;
    for(let i=0;i<=200;i++){
      const t=i/200,u=1-t;
      const x=u*u*u*7+3*u*u*t*17+3*u*t*t*47+t*t*t*45;
      const depth=3*u*u*t*10+3*u*t*t*38+t*t*t*76;
      if(i)upperArea+=(depth-upperProfile[i-1].depth)*(x+upperProfile[i-1].x);
      upperProfile.push({depth,x,area:upperArea});
    }
    const sandArea=41*58;
    function sandDepth(amount) {
      const target=amount*sandArea;
      for(let i=1;i<upperProfile.length;i++){
        const a=upperProfile[i-1],b=upperProfile[i];
        if(b.area>=target)return a.depth+(b.depth-a.depth)*(target-a.area)/(b.area-a.area);
      }
      return 76;
    }
    function hourglass() {
      const now=performance.now(),sand=sandClock.read(now);
      ctx.save();ctx.translate(0,-9);ctx.rotate(sand.angle);
      ellipse(0,0,108,108,palette.ink,false,.09);
      for(let i=0;i<12;i++){
        const a=i*tau/12;path([[Math.cos(a)*104,Math.sin(a)*104],[Math.cos(a)*109,Math.sin(a)*109]],palette.ink,1,false,.25);
      }
      [-62,62].forEach(x=>path([[x,-82],[x,82]],palette.gold,4));
      glassPath();
      ctx.fillStyle=palette.paper;ctx.fill();ctx.fillStyle=palette.leaf;ctx.globalAlpha=.055;ctx.fill();ctx.globalAlpha=.7;ctx.strokeStyle=palette.leaf;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1;
      ctx.save();glassPath();ctx.clip();
      const depth=sandDepth(sand.upper),pileScale=Math.sqrt(sand.lower),pileTop=71-58*pileScale;
      if(sand.upper>0){
        ctx.fillStyle=palette.gold;ctx.globalAlpha=.72;ctx.fillRect(-50,-depth,100,depth);ctx.globalAlpha=1;
        path([[-50,-depth],[50,-depth]],palette.gold,1,false,.95);
      }
      if(sand.lower>0)path([[-41*pileScale,71],[0,pileTop],[41*pileScale,71]],palette.gold,1,true,.72);
      if(sand.flowing&&!reduced.matches){
        path([[0,-2],[0,pileTop]],palette.gold,1,false,.28);
        for(let i=0;i<11;i++){
          const phase=((now/650+i/11)%1),y=phase*phase*pileTop;
          ellipse(Math.sin(i*7.3)*1.15,y,.9,1.5,palette.gold,true,.85);
        }
      }
      ctx.restore();
      [-83,83].forEach(y=>{ellipse(0,y,77,12,palette.paper,true);ellipse(0,y,77,12,palette.gold,true,.16);ellipse(0,y,77,12,palette.gold,false,.9,2);});
      path([[-32,-61],[-24,-39]],palette.paper,3,false,.8);
      ctx.restore();
    }
    function dragon(t) {
      ctx.save();ctx.translate(0,-4);
      // Broad leaf wings, with their veins still visible.
      path([[-18,-5],[18,-91],[126,-68],[78,16],[28,31]],palette.leaf,1.8,true,.11);
      path([[8,-7],[-36,-82],[-123,-55],[-70,12],[-20,28]],palette.leaf,1.8,true,.07);
      [[18,-91],[126,-68],[78,16],[28,31]].forEach(p=>path([[-18,-5],p],palette.leaf,1.1,false,.55));
      [[-36,-82],[-123,-55],[-70,12],[-20,28]].forEach(p=>path([[8,-7],p],palette.leaf,1,false,.36));
      // A long, calm dragon curled around the things entrusted to it.
      ellipse(17,34,72,35,palette.leaf,true,.11);
      ellipse(17,34,72,35,palette.leaf,false,.78,2);
      ctx.beginPath();ctx.moveTo(-34,29);ctx.bezierCurveTo(-62,8,-68,-35,-48,-59);
      ctx.bezierCurveTo(-34,-76,-12,-76,2,-63);
      ctx.strokeStyle=palette.gold;ctx.lineWidth=17;ctx.globalAlpha=.13;ctx.stroke();
      ctx.strokeStyle=palette.gold;ctx.lineWidth=2;ctx.globalAlpha=.88;ctx.stroke();
      ellipse(-39,-68,27,15,palette.paper,true);
      ellipse(-39,-68,27,15,palette.gold,true,.12);
      ellipse(-39,-68,27,15,palette.gold,false,.9,1.6);
      path([[-56,-78],[-48,-99],[-38,-79],[-27,-101],[-23,-76]],palette.gold,1.6,false,.9);
      ellipse(-49,-69,2.5,2.5,palette.leaf,true,.95);
      path([[-63,-64],[-72,-61],[-63,-59]],palette.gold,1,false,.7);
      ctx.beginPath();ctx.moveTo(76,37);ctx.bezierCurveTo(130,45,135,79,105,87);
      ctx.bezierCurveTo(87,91,78,77,88,70);
      ctx.strokeStyle=palette.leaf;ctx.lineWidth=12;ctx.globalAlpha=.11;ctx.stroke();
      ctx.strokeStyle=palette.leaf;ctx.lineWidth=2;ctx.globalAlpha=.82;ctx.stroke();
      [[-29,54,-45,84],[-4,62,-10,91],[39,60,31,90],[62,52,67,84]].forEach(q=>{
        path([[q[0],q[1]],[q[2],q[3]]],palette.gold,4,false,.35);
        path([[q[2]-5,q[3]],[q[2],q[3]-4],[q[2]+5,q[3]]],palette.ink,1,false,.48);
      });
      for(let i=0;i<8;i++)path([[-10+i*13,5-Math.sin(i)*3],[-6+i*13,-5-Math.sin(i)*3]],palette.gold,1.1,false,.55);
      // Unfinished treasures: an open circle, half a star, and a wandering line.
      ctx.beginPath();ctx.arc(-9,45,9,.4,tau-1);ctx.strokeStyle=palette.gold;ctx.lineWidth=1.5;ctx.globalAlpha=.7;ctx.stroke();
      path([[8,49],[14,38],[20,49]],palette.leaf,1.5,false,.72);
      ctx.beginPath();ctx.moveTo(28,48);ctx.bezierCurveTo(34,35,42,57,49,43);ctx.strokeStyle=palette.ink;ctx.lineWidth=1.2;ctx.globalAlpha=.38;ctx.stroke();
      // Each entrusted almost becomes a small warm spark beneath the wing.
      const kept=Math.min(dragonAttempt,6);
      for(let i=0;i<kept;i++){
        const a=-.35+i*.36, x=10+Math.cos(a)*24, y=37+Math.sin(a)*13;
        ellipse(x,y,3.2,3.2,palette.gold,true,.28);
        ellipse(x,y,1.5,1.5,palette.gold,true,.92);
      }
      if(dragonAttempt>0&&t<1){
        const x=-142+(145*t), y=-61+88*t-35*Math.sin(t*Math.PI);
        ellipse(x,y,5,5,palette.gold,true,.16);
        ellipse(x,y,2.2,2.2,palette.gold,true,.9);
        for(let i=0;i<4;i++){
          const a=i*Math.PI/2+t*3;
          path([[x+Math.cos(a)*7,y+Math.sin(a)*7],[x+Math.cos(a)*11,y+Math.sin(a)*11]],palette.gold,1,false,.55);
        }
      }
      ctx.restore();ctx.globalAlpha=1;
    }
    function draw() {
      const dpr=Math.min(devicePixelRatio||1,2);
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
      ctx.translate(width/2,height*.53);const scale=Math.min(width/370,height/345);ctx.scale(scale,scale);
      ctx.lineCap='round';ctx.lineJoin='round';
      pedestal();
      const ease=1-Math.pow(1-progress,3);
      if(current===0)compass(ease);
      if(current===1)umbrella(progress);
      if(current===2)hourglass();
      if(current===3)dragon(progress);
    }
    function resize() {
      width=canvas.clientWidth;height=canvas.clientHeight;
      const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);draw();
    }
    function animate() {
      cancelAnimationFrame(raf);progress=reduced.matches?1:0;start=performance.now();
      const tick=now=>{progress=Math.min(1,(now-start)/1600);draw();if(progress<1)raf=requestAnimationFrame(tick);};
      if(reduced.matches)draw();else raf=requestAnimationFrame(tick);
    }
    function stopAnimation() {
      cancelAnimationFrame(raf);clearTimeout(sandTimer);
    }
    function updateSandCopy(sand) {
      const phase=sand.turning?'turning':sand.flowing?'flowing':sand.hasRun?'finished':'ready';
      action.disabled=sand.turning;
      if(phase===sandPhase)return;
      sandPhase=phase;
      action.textContent=sand.turning?'Turning over…':sand.flowing?'Turn it over':sand.hasRun?'Borrow another minute':'Borrow a minute';
      note.textContent=sand.turning?'A small change of perspective.':sand.flowing?'One quiet minute. You owe it nothing.':sand.hasRun?'That minute was yours. There is no hurry.':exhibits[2].note;
      canvas.setAttribute('aria-label',sand.turning?'The hourglass is turning over.':sand.flowing?'Sand is draining from the top bulb, falling through the neck, and collecting in a pile below.':'The sand rests in the bottom bulb. Turn the hourglass over to start one minute.');
    }
    function runHourglass() {
      stopAnimation();
      const tick=()=>{
        if(current!==2)return;
        const sand=sandClock.read(performance.now());
        updateSandCopy(sand);draw();
        if(sand.turning||sand.flowing){
          if(reduced.matches)sandTimer=setTimeout(tick,1000);
          else raf=requestAnimationFrame(tick);
        }
      };
      tick();
    }
    buttons.forEach(button=>button.addEventListener('click',()=>{
      stopAnimation(); current=Number(button.dataset.exhibit);progress=1;action.disabled=false;sandPhase='';
      const e=exhibits[current];title.textContent=e.name;note.textContent=e.note;action.textContent=e.action;
      number.textContent='Object 0'+(current+1)+' / 04 · '+e.material;canvas.setAttribute('aria-label',e.alt);
      buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
      rainUp=false;
      if(current===2)runHourglass();else draw();
    }));
    action.addEventListener('click',()=>{
      if(current===0){
        const eased=1-Math.pow(1-progress,3);fromAngle=fromAngle+(toAngle-fromAngle)*eased;turns++;
        toAngle=fromAngle+tau+1.3+(turns%3)*.8;
        const destinations=['Toward the long way home.','Toward a very interesting wrong turn.','Toward the thing you nearly walked past.','Toward a door with no sensible explanation.'];
        note.textContent=destinations[(turns-1)%destinations.length];
      }else if(current===1){rainUp=!rainUp;note.textContent=rainUp?'Returned to sender. With love.':'Sometimes the sky needs its rain back.';action.textContent=rainUp?'Let it fall':'Return the rain';
      }else if(current===2){
        sandClock.flip(performance.now(),reduced.matches);runHourglass();return;
      }else{
        dragonAttempt++;
        note.textContent='Safely kept. Almost is a stage, not a verdict.';
        action.textContent='Entrust another';
      }
      animate();
    });
    colors();new ResizeObserver(resize).observe(canvas);
    const themeObserver=new MutationObserver(()=>{colors();draw();});themeObserver.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{colors();draw();});
    reduced.addEventListener('change',()=>{if(current===2)runHourglass();});
  })();
  </script>
</div>

</main>
